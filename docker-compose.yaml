services:
    php:
        build: .
        image: map-classifier-php:8.4
        user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
        environment:
            DOFUS_PATH: /dofus
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
            LANG_DIR: /lang
            DOFUS_LANG: ${DOFUS_LANG:-en}
        volumes:
            - .:/app
            - ${DOFUS_CLIENT_DIR:-../arakneweb/Dofus}:/dofus:ro
            - ${DOFUS_LANG_DIR:-../arakneweb/lang/swf}:/lang:ro
