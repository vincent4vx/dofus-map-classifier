services:
    php:
        build: .
        image: map-classifier-php:8.4
        user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
        environment:
            DOFUS_PATH: /dofus
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            OPENAI_MODEL: ${OPENAI_MODEL:-luna}
        volumes:
            - .:/app
            - ${DOFUS_CLIENT_DIR:-../arakneweb/Dofus}:/dofus:ro
